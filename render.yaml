services:
  # ── 後端 FastAPI ──────────────────────────────────────────────
  - type: web
    name: taiwan-stock-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false       # 手動在 Dashboard 設定 Neon PostgreSQL URL，render.yaml 不覆蓋
      - key: CORS_ORIGINS
        value: https://taiwan-stock-frontend.onrender.com
      - key: MAX_WORKERS
        value: "2"        # 降低並行數避免 Yahoo Finance rate limit
      - key: BATCH_SIZE
        value: "60"
      - key: HISTORY_DAYS
        value: "160"
      - key: CHART_HISTORY_DAYS
        value: "280"
      - key: SCAN_LIMIT
        value: "0"
    healthCheckPath: /health

  # ── 前端 Next.js ──────────────────────────────────────────────
  - type: web
    name: taiwan-stock-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://taiwan-stock-backend-utuw.onrender.com

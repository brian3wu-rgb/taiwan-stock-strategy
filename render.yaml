services:

  # ── 後端 (FastAPI) ────────────────────────────────────────────────────
  - type: web
    name: taiwan-stock-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free

    envVars:
      - key:   DATABASE_URL
        value: /app/data/stocks.db
      - key:   CORS_ORIGINS
        value: https://taiwan-stock-frontend.onrender.com
      - key:   MAX_WORKERS
        value: "2"
      - key:   BATCH_SIZE
        value: "40"
      - key:   HISTORY_DAYS
        value: "160"
      - key:   SCAN_LIMIT
        value: "0"

    healthCheckPath: /health

  # ── 前端 (Next.js) ────────────────────────────────────────────────────
  - type: web
    name: taiwan-stock-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free

    buildArgs:
      NEXT_PUBLIC_API_URL: https://taiwan-stock-backend.onrender.com

    envVars:
      - key:   NEXT_PUBLIC_API_URL
        value: https://taiwan-stock-backend.onrender.com
